group = 'com.mattrohde.gakuji_paddle_ocr'
version = '0.1.0'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = 'com.mattrohde.gakuji_paddle_ocr'
    compileSdk = 35

    defaultConfig {
        minSdk = 26
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // The Flutter bridge lives in src/main/kotlin. The official PaddleOCR
    // Android SDK is installed into src/main/java exactly as Paddle ships it.
    // Kotlin's Android plugin compiles .kt files from Android Java source roots,
    // while this extra source dir preserves the normal Flutter plugin layout.
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

def paddleSdkEntry = file('src/main/java/com/paddle/ocr/PaddleOCR.kt')
def verifyPaddleSdkSource = tasks.register('verifyPaddleSdkSource') {
    doLast {
        if (!paddleSdkEntry.isFile()) {
            throw new GradleException(
                'PaddleOCR Android SDK source is missing. Run ' +
                'tools/install_paddle_android.ps1 from the Gakuji project root ' +
                'before building the Android app. Expected: ' + paddleSdkEntry
            )
        }
    }
}

afterEvaluate {
    tasks.named('preBuild').configure {
        dependsOn verifyPaddleSdkSource
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.21.1'
    implementation 'com.quickbirdstudios:opencv:4.5.3.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.core:core-ktx:1.15.0'
}
