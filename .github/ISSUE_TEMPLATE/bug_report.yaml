name: 🐛 Bug Report
description: Report a reproducible glitch, error, or UI issue.
title: "fix(): "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Remember to use the `fix(scope): description` format for the title above!

  - type: dropdown
    id: priority
    attributes:
      label: 🚦 Priority Level
      description: |
        Low -> Cosmetic issues, layout tweaks, text truncation  
        Medium -> Feature is degraded but usable, broken workaround  
        High -> App crash, broken core loop, login failure, data loss
      options:
        - "Low"
        - "Medium"
        - "High"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📝 Description
      description: \
      placeholder: "e.g., On the home page, the deck titles cut off into ellipses too early..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 🎯 Expected Behavior
      description: \
      placeholder: "e.g., The title should stretch across the card or wrap to the next line."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 👣 Steps to Reproduce
      description: \
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 💻 Environment & Context
      description: \
      placeholder: "e.g., Chrome v120 on macOS Sonoma, mobile viewport"
    validations:
      required: false
