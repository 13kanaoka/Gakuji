name: 🚀 Feature Request
description: Suggest a new idea, feature, or enhancement for the project.
title: "feat(): "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a new feature! 
        Remember to use the `feat(scope): description` format for the title above!

  - type: dropdown
    id: priority
    attributes:
      label: 🎯 Priority Level
      description: How important is this feature to the project?
      options:
        - "Low (Nice-to-have, minor quality-of-life tweak)"
        - "Medium (Solid enhancement, improves core user experience)"
        - "High (Critical roadblock, essential for product launch)"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 🛑 Problem Statement
      description: What problem are you trying to solve?
      placeholder: "e.g., I'm frustrated when I can't organize my decks into folders..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 💡 Proposed Solution
      description: A clear description of what you want to happen.
      placeholder: "e.g., Add a folder icon next to the deck builder that lets users group decks."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternative Solutions
      description: Any alternative solutions or workarounds you've considered.
      placeholder: "e.g., Using tags instead of folders could also work."
    validations:
      required: false