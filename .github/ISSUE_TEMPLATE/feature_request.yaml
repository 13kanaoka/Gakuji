name: 🚀 Feature Request
title: "feat(): "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Remember to use the `feat(scope): description` format for the title above!

  - type: dropdown
    id: priority
    attributes:
      label: 🎯 Priority Level
      description: |
        Low -> Nice-to-have, minor quality-of-life tweak  
        Medium -> Solid enhancement, improves core user experience
        High -> Critical roadblock, essential for product launch
      options:
        - "Low"
        - "Medium"
        - "High"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 🛑 Problem Statement
      placeholder: "e.g., I'm frustrated when I can't organize my decks into folders..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 💡 Proposed Solution
      placeholder: "e.g., Add a folder icon next to the deck builder that lets users group decks."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternative Solutions
      placeholder: "e.g., Using tags instead of folders could also work."
    validations:
      required: false
