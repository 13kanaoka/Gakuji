name: Issue labeler

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  label-priority:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Parse bug report form
        if: contains(github.event.issue.labels.*.name, 'bug')
        uses: stefanbuck/github-issue-parser@v3
        id: issue-parser-bug
        with:
          template-path: .github/ISSUE_TEMPLATE/bug_report.yml

      - name: Parse feature request form
        if: contains(github.event.issue.labels.*.name, 'enhancement')
        uses: stefanbuck/github-issue-parser@v3
        id: issue-parser-feature
        with:
          template-path: .github/ISSUE_TEMPLATE/feature_request.yml

      - name: Set priority label (bug)
        if: contains(github.event.issue.labels.*.name, 'bug')
        uses: redhat-plumbers-in-action/advanced-issue-labeler@v2
        with:
          issue-form: ${{ steps.issue-parser-bug.outputs.jsonString }}
          section: priority
          template: bug_report.yml
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set priority label (feature)
        if: contains(github.event.issue.labels.*.name, 'enhancement')
        uses: redhat-plumbers-in-action/advanced-issue-labeler@v2
        with:
          issue-form: ${{ steps.issue-parser-feature.outputs.jsonString }}
          section: priority
          template: feature_request.yml
          token: ${{ secrets.GITHUB_TOKEN }}
