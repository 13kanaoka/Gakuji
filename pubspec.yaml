name: gakuji
description: "Gakuji — a Japanese kanji handwriting and flashcard study app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.2.3
  google_mlkit_digital_ink_recognition: ^0.14.2
  google_mlkit_text_recognition: ^0.15.1
  camera: ^0.12.0+2
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  firebase_auth: ^6.5.6
  google_sign_in: ^7.2.0
  firebase_core: ^4.12.1
  csv: ^8.0.0
  excel: ^4.0.6
  file_picker: ^11.0.3
  flutter_svg: ^2.3.0
  fsrs: ^2.0.1
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.6
  gakuji_paddle_ocr:
    path: packages/gakuji_paddle_ocr

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  # Provides a sqflite implementation for the Dart VM so widget tests can mount
  # screens that touch the on-device database.
  sqflite_common_ffi: ^2.3.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/fugu.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/dictionary/dictionary.db
    - assets/images/deck_watermark_1.png
    - assets/images/deck_watermark_2.png
    - assets/images/deck_watermark_3.png
    - assets/images/deck_page_watermark_hybrid.png
    - assets/images/deck_page_watermark_reading.png
    - assets/images/deck_page_watermark_writing.png
    - assets/images/deck_pattern_hybrid.png
    - assets/images/deck_pattern_reading.png
    - assets/images/deck_pattern_writing.png
    - assets/images/nav_home_bonsai.png
    - assets/images/nav_library_books.png
    - assets/images/pin_icon.png
    - assets/images/learning_kana_pattern.png
    - assets/images/learning_clouds_pattern.png
    - assets/images/learning_kanji_pattern.png
    - assets/images/flashcards.png
    - assets/images/crosscheck.png
    - assets/images/fusion.png
    - assets/images/word_fusion.png
    - assets/images/nav_learning_book.png

  fonts:
    - family: IBMPlexSansJP
      fonts:
        - asset: assets/fonts/IBMPlexSansJP-Thin.ttf
          weight: 100
        - asset: assets/fonts/IBMPlexSansJP-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/IBMPlexSansJP-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansJP-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansJP-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansJP-Bold.ttf
          weight: 700